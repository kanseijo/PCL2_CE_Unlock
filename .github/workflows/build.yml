name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build (tool + injection hook)
        run: pwsh -File build.ps1 PCL2_CE_Unlock

      - name: Assemble package
        shell: pwsh
        run: |
          # 说明：用 -Path <目录> 而不是 <目录>\*，这样压缩包内会保留顶层文件夹 PCL2_CE_Unlock/，
          # 用户解压后直接得到可用的文件夹，不必手动新建（不同解压工具行为一致）。
          Copy-Item README.md, THIRD-PARTY-NOTICES.txt -Destination PCL2_CE_Unlock
          Compress-Archive -Path PCL2_CE_Unlock -DestinationPath PCL2_CE_Unlock.zip -Force
          Write-Host '--- 压缩包内容预览（应含顶层 PCL2_CE_Unlock/ 目录）---'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path PCL2_CE_Unlock.zip)).Entries |
            Select-Object -First 12 -ExpandProperty FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL2_CE_Unlock
          path: PCL2_CE_Unlock.zip
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 发版说明：优先用 docs/release-notes/<tag>.md，缺失时回落到 RELEASE_NOTES.md
          $tag = $env:GITHUB_REF_NAME
          $tagNotes = "docs/release-notes/$tag.md"
          $notesFile = if (Test-Path $tagNotes) { $tagNotes } else { "RELEASE_NOTES.md" }
          Write-Host "使用发版说明：$notesFile"
          Get-FileHash PCL2_CE_Unlock.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  PCL2_CE_Unlock.zip" } | Set-Content PCL2_CE_Unlock.zip.sha256
          gh release create $tag PCL2_CE_Unlock.zip PCL2_CE_Unlock.zip.sha256 `
            --title "PCL2_CE_Unlock $tag" `
            --notes-file $notesFile `
            --verify-tag
